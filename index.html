<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <h1>TaskFlow</h1>
            <p>Stay focused. Finish what matters.</p>
        </header>

        <section class="task-input">
            <input type="text" placeholder="Write a task...">
            <button>+</button>
        </section>

       <div class="task-info">
    <span class="task-count">0 tasks</span>
</div>

<section class="tasks">
    <div class="empty-state">
        <h2>No tasks yet</h2>
        <p>Add a task above to get started.</p>
    </div>
</section>

    </main>

    <script src="script.js"></script>
</body>
</html>
